[project]
name = "take-home-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luis Fer Cuevas", email = "lfer_ca@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13,<2",
    "cachetools>=5,<8",
    "fastapi[standard]>=0.141.1",
    "httpx>0.28,<1",
    "psycopg[binary]>=3,<4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2,<3",
    "pydantic[email]>=2,<3",
    "sqlalchemy>=2.0,<2.1",
]

[project.scripts]
take-home-challenge = "take_home_challenge:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
